<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Project Conversational Agents - Start</title>

        <link rel="icon" href="data:;base64,iVBORw0KGgo=">
        <link rel="stylesheet" href="static/css/bootstrap.min.css">
        <script src="static/js/bootstrap.bundle.min.js"></script>
        <script src="static/js/jquery-3.7.1.min.js"></script>
        <script src="static/js/socket.io.min.js"></script>
        <script src="static/js/pca.js" defer></script>
    </head>
    <body>
        <div id="main">
            <main class="container-fluid d-flex align-items-center justify-content-center" style="height: 100vh; width: 100vw;">
                
                <img class="bg-image" style="width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: -1; object-fit: cover;" src="https://images.pexels.com/photos/349609/pexels-photo-349609.jpeg" alt="Background">
                
                <div class="jumbotron text-center p-5 shadow-lg" style="width: 70%; max-width: 800px; background-color: rgba(222, 184, 135, 0.95); border-radius: 15px;">
                    
                    <h1 class="display-4 font-weight-bold mb-3">Welcome to Cooker AI</h1>
                    
                    <p class="lead">
                        You are about to interact with <b>Cooker AI</b>. It helps you find recipes tailored to your taste.
                    </p>
                    
                    <hr class="my-4">

                    <div class="mb-4">
                        <p class="font-weight-bold">How to interact:</p>
                        <div class="d-flex justify-content-center align-items-center gap-3">
                            <div class="mx-3">
                                <img style="width:2rem;" src="static/images/mic_out.png" alt="Mic Out">
                                <br><small>Push to talk</small>
                            </div>
                            <div class="mx-3">
                                <img style="width:2rem;" src="static/images/mic_on.png" alt="Mic On">
                                <br><small>Agent listening</small>
                            </div>
                        </div>
                        <p class="mt-3 text-muted">When you are ready, press the button below.</p>
                    </div>

                    <button class="btn btn-info btn-lg px-5" id="start" style="border-radius: 30px; font-size: 1.3rem;">
                        <b>Start Conversation</b>
                    </button>
                </div>

            </main>
        </div>
    </body>
</html>
